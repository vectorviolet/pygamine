[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygamine"
version = "0.27.0"
description = "Shared pygame utilities for personal game projects"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Umutcan Ekinci", email = "umutcannekinci@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pyyaml",
    "pytmx",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
# `uv run pygamine-coverage-badge` from a host project's repo root --
# replaces the byte-identical scripts/make_coverage_badge.py every host
# project used to carry a copy of.
pygamine-coverage-badge = "pygamine.devtools.coverage_badge:main"
# `uv run --with moviepy pygamine-mp4-converter intro.mp4 -o out` from a
# host project -- turns a video into frames + meta.yaml + .ogg for
# ImageSequenceMedia. (`--with "pygamine[video]"` would look pygamine up
# on PyPI, which it isn't on; the host env already has pygamine itself.)
pygamine-mp4-converter = "pygamine.devtools.mp4_converter:main"

[project.optional-dependencies]
# Only the mp4 converter devtool needs it (it bundles ffmpeg); games that
# just play image sequences don't.
video = ["moviepy>=2"]

[tool.setuptools.packages.find]
include = ["pygamine*"]

[tool.setuptools.package-data]
# PEP 561 marker -- lets type checkers (mypy/pyright) pick up this
# package's inline type hints when it's installed, not just when it's
# vendored on sys.path inside the same checkout being type-checked.
# branding/ (the shared splash assets standard_splash_media() plays) and
# licenses/ (third-party license texts games ship) aren't packages (no
# __init__.py), so they must be listed to ship at all.
pygamine = ["py.typed", "branding/**/*", "licenses/**/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.2", "mypy>=1.13", "types-PyYAML", "moviepy>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real-socket loopback tests (slower)",
]

[tool.ruff]
# ruff's own default, written out: both `ruff check` and `ruff format` use it.
line-length = 88

[tool.ruff.format]
# Black-compatible formatting; Black's defaults throughout.
quote-style = "double"

[tool.ruff.lint]
# Deliberately narrow: F (pyflakes -- real bugs like unused imports/vars)
# and I002 specifically (only the required-imports check below, not all of
# I -- I001 would additionally enforce import *sort order* repo-wide, a
# much bigger reformatting pass this isn't about). Not E/W (pycodestyle)
# either, which would flag ~200 long lines across tests/ that were a
# deliberate style choice, not an oversight.
#
# ANN201-ANN206: every function and method in pygamine/ declares its return
# type (`-> None` included). Only the return-type rules, not the argument
# ones (ANN001...): many parameters are deliberately duck-typed.
#
# PLR6301 (no-self-use): a method that doesn't use `self` is a staticmethod
# or classmethod, or carries a `noqa` saying why it stays an instance method
# (e.g. it implements a protocol). It's a preview rule, so preview is on, but
# explicit-preview-rules keeps every other preview rule off unless it's
# selected by its exact code.
select = [
    "F",
    "I002",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "PLR6301",
]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Test functions don't get `-> None`: pytest calls them and no type checker
# covers tests/. Fixtures and helpers that return a value still declare it
# (by convention -- these rules can't tell them apart from test functions).
#
# PLR6301 is off in tests/: its hits there are test doubles overriding engine
# hooks (update, draw, on_enable, ...), which must stay instance methods.
"tests/**" = ["ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "PLR6301"]

[tool.mypy]
python_version = "3.12"
# Deliberately permissive, mirroring [tool.ruff.lint]'s "start narrow"
# approach: no --strict, untyped function bodies aren't checked yet. The
# goal right now is catching real type errors in already-annotated code
# (e.g. a `Surface | None` dereferenced without narrowing it first), not
# demanding a full annotation pass across the codebase in one go.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No published stubs (and no types-pytmx package) as of this writing.
module = ["pytmx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# moviepy ships no type information.
module = ["moviepy.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# Enforced repo-wide, not just where a type hint would otherwise need it
# (ruff's semantic FA rules find nothing on this project's Python 3.12+
# floor) -- consistency previously enforced this way, this document caught
# a real cross-project break once already (see CLAUDE.md's pygamine
# bump note): a Transform self-referencing type hint needed this import to
# evaluate lazily, and it only worked locally by accident because that one
# machine's Python defers annotation evaluation by default anyway.
required-imports = ["from __future__ import annotations"]
